# Deployt de site naar Webslice: elke push naar main naar acceptatie, elke
# versietag (vX.Y.Z) naar productie. Terugdraaien: "Run workflow" met een
# oudere tag bij "Use workflow from". Een handmatige run vanaf main deployt
# acceptatie opnieuw. Zie specs/2026-11-11-deploy-github-actions.md.
name: Deploy

on:
  push:
    branches: [main]
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy naar ${{ github.ref_type == 'tag' && 'productie' || 'acceptatie' }}
    runs-on: ubuntu-latest
    # Per environment een eigen DEPLOY_SSH_KEY. De environment 'productie' staat
    # alleen tags v* toe, 'acceptatie' alleen main.
    environment: ${{ github.ref_type == 'tag' && 'productie' || 'acceptatie' }}
    # Nooit twee deploys tegelijk naar dezelfde omgeving; een nieuwere wacht.
    concurrency:
      group: deploy-${{ github.ref_type == 'tag' && 'productie' || 'acceptatie' }}
      cancel-in-progress: false
    steps:
      # Volledige historie en tags: het script controleert of de commit op
      # main staat en (voor productie) een versietag heeft.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # Leest de pnpm-versie uit `packageManager` in package.json.
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: SSH-toegang instellen
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          install -d -m 700 ~/.ssh
          install -m 600 /dev/null ~/.ssh/id_ed25519
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/id_ed25519
          # Vastgelegde hostsleutels: wijkt een server af, dan faalt de deploy.
          cat > ~/.ssh/known_hosts <<'EOF'
          obnl-acc-ws1.cust.webslice.eu ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIO4fsIQlvXH92/WOEM0rt2+hs00p1kv8141BSxmjq/bg
          obnl-prd-ws1.cust.webslice.eu ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIOcXH5g7aaG7eYrxLuGAzV4TkoPNNB92Kt++26BT9fjL
          EOF

      - name: Deploy
        env:
          # De deploy-sleutel is op de server met rrsync beperkt tot current/.
          DEPLOY_RRSYNC: "1"
        run: bash scripts/deploy.sh ${{ github.ref_type == 'tag' && 'prod' || 'acc' }}
